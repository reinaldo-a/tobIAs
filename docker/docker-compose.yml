services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  app: # Este é o seu projeto Java com Tomcat
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: java_app
    ports:
      - "8888:8080"
    depends_on:
      - db
    env_file:
      - ../.env

volumes:
  postgres_data: