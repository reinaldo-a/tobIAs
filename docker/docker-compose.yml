services:

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: java_app
    depends_on:
      - db
    volumes:
      - ..:/app
    command: mvn clean compile exec:java -Dexec.mainClass="application.Main"

  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data: