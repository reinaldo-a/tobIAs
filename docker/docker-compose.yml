version: "3.9"

services:

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: java_app
    depends_on:
      - db
    volumes:
      - ../src:/app/src
    command: sh -c "find src -name '*.java' -exec javac {} + && java -cp src Main"

  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: learn_db
      POSTGRES_USER: learn_user
      POSTGRES_PASSWORD: learn_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data: